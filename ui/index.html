<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluids MCP - AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 24px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .header .subtitle {
      font-size: 12px;
      color: #8b949e;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.user {
      background: #1f6feb;
      align-self: flex-end;
      border-radius: 8px 8px 2px 8px;
    }

    .message.assistant {
      background: #161b22;
      border: 1px solid #21262d;
      align-self: flex-start;
      border-radius: 8px 8px 8px 2px;
    }

    .message.error {
      background: #2d1b1b;
      border: 1px solid #f85149;
      align-self: flex-start;
      color: #f85149;
    }

    .message .tool-badge {
      display: inline-block;
      font-size: 10px;
      background: #21262d;
      color: #8b949e;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .loading {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 16px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      align-self: flex-start;
    }

    .loading span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b949e;
      animation: bounce 1.2s infinite;
    }

    .loading span:nth-child(2) { animation-delay: 0.2s; }
    .loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      font-family: inherit;
      padding: 10px 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
    }

    textarea:focus {
      border-color: #1f6feb;
    }

    textarea::placeholder {
      color: #484f58;
    }

    button {
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      height: 44px;
      white-space: nowrap;
    }

    button:hover { background: #388bfd; }
    button:disabled {
      background: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }

    .examples {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px 12px;
    }

    .example-btn {
      background: #161b22;
      border: 1px solid #21262d;
      color: #8b949e;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      height: auto;
    }

    .example-btn:hover {
      border-color: #1f6feb;
      color: #e6edf3;
      background: #161b22;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <div>
    <h1>Fluids MCP - AI Assistant</h1>
    <div class="subtitle">CFD UDF Generation & Setup Validation</div>
  </div>
</div>

<div class="chat-container" id="chat">
  <div class="message assistant">
    👋 Hello! I'm your CFD AI assistant powered by the Fluids MCP platform.<br><br>
    I can help you with:<br>
    • <strong>UDF Generation</strong> - describe the physics, I'll write the C code<br>
    • <strong>Setup Validation</strong> - describe your simulation setup, I'll check it
  </div>
</div>

<div class="examples">
  <button class="example-btn" onclick="setQuery('Generate a UDF for parabolic inlet velocity profile')">
    UDF: Parabolic inlet velocity
  </button>
  <button class="example-btn" onclick="setQuery('Validate my k-epsilon turbulence setup for pipe flow')">
    Validate: k-epsilon pipe flow
  </button>
  <button class="example-btn" onclick="setQuery('Write a UDF for temperature dependent viscosity')">
    UDF: Temperature viscosity
  </button>
</div>

<div class="input-area">
  <textarea
    id="input"
    placeholder="Describe what you need - UDF generation or setup validation..."
    rows="1"
    onkeydown="handleKey(event)"
    oninput="autoResize(this)"
  ></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function setQuery(text) {
    input.value = text;
    input.focus();
    autoResize(input);
  }

  function addMessage(content, type, toolUsed) {
    const div = document.createElement('div');
    div.className = `message ${type}`;
    if (toolUsed) {
      div.innerHTML = `<div class="tool-badge">🔧 ${toolUsed}</div>\n${content}`;
    } else {
      div.textContent = content;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addLoading() {
    const div = document.createElement('div');
    div.className = 'loading';
    div.id = 'loading';
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function removeLoading() {
    const el = document.getElementById('loading');
    if (el) el.remove();
  }

  async function sendMessage() {
    const query = input.value.trim();
    if (!query) return;

    addMessage(query, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const loading = addLoading();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
      });

      const data = await response.json();
      removeLoading();

      if (data.success) {
        const result = typeof data.result === 'object'
          ? JSON.stringify(data.result, null, 2)
          : data.result;
        addMessage(result, 'assistant', data.tool_used);
      } else {
        addMessage(
          `Error: ${data.error || 'Something went wrong'}`,
          'error'
        );
      }

    } catch (err) {
      removeLoading();
      addMessage('Connection error - is the server running?', 'error');
    }

    sendBtn.disabled = false;
    input.focus();
  }
</script>

</body>
</html>
